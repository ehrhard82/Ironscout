<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status · IronScout</title><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="IronScout"><link rel="stylesheet" href="/app.css">
<style>
  body { font-size:14px; } main { max-width:720px; margin:0 auto; padding:12px; }
  .line { padding:6px 0; border-bottom:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .line b { min-width:120px; } .ok { color:var(--good); } .bad { color:var(--warn); } .dim { color:var(--muted); }
  .src { display:inline-block; padding:1px 7px; border-radius:999px; background:#232835; font-size:12px; margin-right:4px; }
  .src.bad { background:#3a1f1f; }
  details > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:8px 0; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary h3 { margin:0; font-size:17px; }
  details > summary::before { content:"▸"; color:var(--muted); width:14px; transition:transform .15s; }
  details[open] > summary::before { transform:rotate(90deg); }
  .jumps { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:6px; overflow-x:auto; padding:8px 0 10px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .jumps a { white-space:nowrap; font-size:13px; color:var(--text); background:#1c2029; border:1px solid var(--line); border-radius:999px; padding:5px 11px; text-decoration:none; }
  #totop { position:fixed; right:14px; bottom:18px; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#1a1200; border:0; font-size:20px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.4); display:none; z-index:6; min-height:0; padding:0; }
  #totop.show { display:block; }
</style></head><body>
<header id="hdr"></header>
<main>
  <div class="jumps"><a href="#sec-health">Health</a><a href="#sec-machines">Machines</a><a href="#sec-errors">Errors</a></div>
  <details id="sec-health" open><summary><h3>Health</h3></summary><div id="top" class="dim">Loading…</div></details>
  <details id="sec-machines"><summary><h3>Machines <span id="mcount" class="dim small"></span></h3></summary>
    <input id="mfind" placeholder="Find a machine…" style="width:100%;margin:6px 0 8px">
    <div id="machines"></div></details>
  <details id="sec-errors"><summary><h3>Errors (last 2 days) <span id="ecount" class="dim small"></span></h3></summary><div id="errors" class="small"></div></details>
</main>
<button id="totop" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script src="/app.js"></script>
<script>
(function () {
  const all = [...document.querySelectorAll('details[id^=sec-]')];
  let saved = null; try { saved = JSON.parse(localStorage.getItem('status-open') || 'null'); } catch {}
  if (saved) for (const d of all) d.open = saved.includes(d.id);
  document.addEventListener('toggle', () => { try { localStorage.setItem('status-open', JSON.stringify(all.filter(d => d.open).map(d => d.id))); } catch {} }, true);
  document.querySelector('.jumps').addEventListener('click', (e) => { const a = e.target.closest('a'); if (!a) return; const d = document.querySelector(a.getAttribute('href')); if (d) d.open = true; });
  addEventListener('scroll', () => document.getElementById('totop').classList.toggle('show', scrollY > 600), { passive: true });
})();
(async () => {
  const user = await requireUser();
  if (user.role !== 'admin') { location.href = '/'; return; }
  $('hdr').innerHTML = renderHeader(user, '/status.html'); wireLogout();
  const s = await api('/api/admin/status');
  const b = s.budget;
  $('top').innerHTML = `<div class="line"><b>Build</b> ${esc(s.build)}</div>
    <div class="line"><b>Apify today</b> ${b ? `${b.used} of ${b.cap} ${b.left <= 0 ? '<span class="bad">— CAP REACHED</span>' : ''}` : '?'}</div>
    <div class="line"><b>Sources</b> ${s.sources.join(', ')}</div>
    <div class="line"><b>Daily refresh</b> ${s.last_refresh_started ? `started ${new Date(s.last_refresh_started).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}${s.last_refresh_done && new Date(s.last_refresh_done) >= new Date(s.last_refresh_started) ? ', finished ' + new Date(s.last_refresh_done).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ', still going'}` : '<span class="dim">never</span>'}${s.sat_out_today && s.sat_out_today.length ? ` · <span class="dim">resting today (nothing new last pass): ${esc(s.sat_out_today.join(', '))}</span>` : ''}</div>
    <div class="line"><b>Running now</b> ${s.queue.running ? esc(s.queue.running) + (s.queue.running_minutes > 1 ? ` <span class="dim">(${s.queue.running_minutes} min)</span>` : '') : '<span class="dim">nothing</span>'}${s.queue.queued.length ? ` · queued: ${s.queue.queued.map(esc).join(', ')}` : ''}</div>
    <div class="line"><b>Totals</b> ${s.totals.listings} listings · ${s.totals.sales} sales · ${s.totals.deals} open deals · ${s.totals.users} users · ${s.totals.buyers} buyers</div>`;
  $('machines').innerHTML = s.machines.map(m => `<div class="line"><b>${esc(m.name)}</b> <button class="danger small" data-del="${m.id}" data-name="${esc(m.name)}" data-w="${m.watchers}" style="padding:2px 8px;margin-left:auto">Delete</button>
    <span>${m.listings} listings · ${m.sales} sales · <span class="${m.deals ? 'ok' : 'dim'}">${m.deals} deals</span>${m.market ? ` · mkt ${money(m.market)} (${m.basis})${m.sample_size < 8 ? ' <span class="bad">thin data (' + m.sample_size + ')</span>' : ''}` : ' · <span class="dim">no market value yet</span>'}</span>
    <span class="dim small">${m.watchers ? `${m.watchers} watching · ` : ''}${m.last_fetch ? 'fetched ' + new Date(m.last_fetch).toLocaleString(undefined, { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'never fetched'}</span>
    <span>${m.last_by_source.map(x => `<span class="src ${x.error ? 'bad' : ''}" title="${esc(x.error || '')}">${esc(x.source)} ${x.error ? '✗' : x.fetched}</span>`).join('')}</span></div>`).join('') || '<div class="dim">No machines yet.</div>';
  $('mcount').textContent = `(${s.machines.length})`; $('ecount').textContent = s.recent_errors.length ? `(${s.recent_errors.length})` : '';
  $('mfind').oninput = () => { const q = $('mfind').value.trim().toLowerCase(); document.querySelectorAll('#machines .line').forEach(el => { el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none'; }); };
  if ((s.hidden_idle || []).length) $('machines').innerHTML += `<div class="dim" style="margin-top:10px">Hidden (old, nothing found): ${s.hidden_idle.map(esc).join(', ')}</div>`;
  $('machines').onclick = async (ev) => {
    const b = ev.target.closest('[data-del]'); if (!b) return;
    const w = Number(b.dataset.w);
    if (!confirm(`Delete "${b.dataset.name}" and everything saved for it?${w ? ` ${w} watching it will lose it too.` : ''}`)) return;
    try { await api('/api/admin/machines/' + b.dataset.del, { method: 'DELETE' }); b.closest('.line').remove(); } catch (e) { alert('Could not delete: ' + e.message); }
  };
  $('errors').innerHTML = s.recent_errors.length ? s.recent_errors.map(e => `<div class="line bad"><span class="dim">${new Date(e.started_at).toLocaleString()}</span> <b>${esc(e.source)}</b> ${esc(e.product || '')}: ${esc(e.error)}</div>`).join('') : '<div class="ok">None.</div>';
})().catch(e => { if (!['login', 'subscribe'].includes(e.message)) console.error(e); });
</script></body></html>
