<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IronScout</title><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="IronScout"><link rel="stylesheet" href="/app.css">
<style>
  .hero { max-width:760px; margin:40px auto 10px; padding:0 20px; text-align:center; }
  .hero h2 { font-size:28px; margin:0 0 6px; } .hero p { color:var(--muted); margin:0 0 22px; font-size:16px; }
  .big { display:flex; gap:10px; }
  .big input { flex:1 1 0; width:100%; min-width:0; font-size:20px; padding:16px 18px; border-radius:12px; }
  .big button { flex:0 0 auto; font-size:18px; padding:16px 22px; border-radius:12px; white-space:nowrap; }
  @media (max-width:480px){ .big { flex-direction:column; } .big button { width:100%; } }
  .chips { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:14px; }
  @media (min-width:600px){ .chips { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); } }
  .chips .allmine { grid-column:1/-1; }
  .chips button { font-size:13px; line-height:1.2; padding:8px 10px; min-width:0; border-radius:14px; background:#1c2029; white-space:normal; }
  .market { max-width:900px; margin:26px auto 0; padding:0 20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat .v { font-size:22px; font-weight:700; } .stat .l { color:var(--muted); font-size:13px; }
  .heading { max-width:900px; margin:26px auto 0; padding:0 20px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .heading h3 { margin:0; font-size:18px; } .heading .small a { color:var(--muted); }
  main { max-width:1200px; margin:0 auto; }
  .sortrow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sortrow .viewtoggle { flex:0 0 auto; margin-left:auto; }
  .listhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .listhead h2 { margin:0; flex:1 1 auto; }
  @media (max-width:480px) { .listhead .viewtoggle { flex:1 1 100%; display:flex; } .listhead .viewtoggle button { flex:1; } }
  .sortrow label { display:flex; align-items:center; gap:6px; flex:1 1 150px; min-width:150px; }
  .sortrow select { flex:1 1 auto; min-width:110px; width:auto; padding:8px 8px; font-size:14px; }
  @media (max-width:480px) { .sortrow .viewtoggle { flex:1 1 100%; margin-left:0; display:flex; } .sortrow .viewtoggle button { flex:1; } }
  .setup { max-width:760px; margin:0 auto 10px; padding:0 20px; }
  .setup .card { gap:4px; }
  .setup h3 { margin:0 0 4px; font-size:16px; }
  .setup .step { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); text-decoration:none; color:var(--text); }
  .setup .step:first-of-type { border-top:0; }
  .setup .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; display:grid; place-items:center; font-size:13px; }
  .setup .done .tick { background:var(--good); border-color:var(--good); color:#06240f; }
  .setup .done span.t { color:var(--muted); text-decoration:line-through; }
  .setup .step small { color:var(--muted); display:block; }
  .setup .dismiss { margin-left:auto; color:var(--muted); font-size:13px; background:none; border:0; min-height:0; padding:0; }
  .welcome { background:linear-gradient(135deg,#2a2410,#181b22); border:1px solid var(--accent); border-radius:12px; padding:16px; }
  .welcome h3 { margin:0 0 6px; font-size:18px; } .welcome p { margin:0 0 6px; line-height:1.5; } .welcome p:last-of-type { margin-bottom:0; }
  .listhead { margin:6px 0 10px; }
</style></head><body>
<header id="hdr"></header>
<div class="hero">
  <h2>What are you looking for?</h2>
  <p>Type a machine. We'll show you what it's selling for and which listings are priced under market.</p>
  <form class="big" id="f"><input id="q" placeholder="wheel loader, winch truck, excavator…" list="products" autofocus autocomplete="off"><datalist id="products"></datalist><button class="primary" type="submit">Look it up</button></form>
  <div class="chips" id="chips"></div>
</div>
<div class="setup" id="welcome"></div>
<div class="setup" id="setup"></div>
<div id="result"></div>
<main><div id="list" class="grid"></div></main>
<script src="/app.js"></script>
<script>
async function unmarkParts(id) { try { await api(`/api/broker/listings/${id}/block`, { method: 'DELETE' }); const el = document.getElementById('part-' + id); if (el) el.remove(); } catch (e) { alert(e.message); } }
</script>
<script>
let user, savedIds = new Set(), current = null, showAll = false;
const qs = new URLSearchParams(location.search);

async function init() {
  user = await requireUser();
  if (!user.has_access) { location.href = '/account.html?subscribe=1'; return; }
  $('hdr').innerHTML = renderHeader(user, '/'); wireLogout();
  const [prods, wl] = await Promise.all([api('/api/products'), api('/api/watchlists')]);
  $('products').innerHTML = prods.products.map(p => `<option value="${esc(p.name)}">`).join('');
  // Quick chips: the user's own machines first, then the most-listed tracked ones
  const mine = wl.watchlists.map(w => w.product);
  // then the rest ranked by how much is going on (open deals, then live listings), 8 showing, "more" for the rest
  const rest = prods.products.filter(p => !mine.includes(p.name)).sort((a, b) => (b.open_deals - a.open_deals) || (b.active_listings - a.active_listings)).map(p => p.name);
  const chip = (m, star) => `<button onclick="go('${esc(m)}')"${star ? ' title="On your watchlist"' : ''}>${star ? '★ ' : ''}${esc(m)}</button>`;
  const first = [...mine, ...rest].slice(0, 8), more = [...mine, ...rest].slice(8);
  window.renderChips = (showAll) => {
    $('chips').innerHTML = [...first, ...(showAll ? more : [])].map(m => chip(m, mine.includes(m))).join('')
      + (more.length ? `<button class="allmine muted" onclick="renderChips(${!showAll})">${showAll ? 'Show fewer' : `${more.length} more machine${more.length === 1 ? '' : 's'}…`}</button>` : '')
      + (mine.length ? `<button class="allmine" onclick="location.href='/mine.html'" style="border-color:var(--accent);color:var(--accent)">All my machines' deals →</button>` : '');
  };
  renderChips(false);
  if (qs.get('q')) go(qs.get('q')); else feed();
  showWelcome();
  showSetup(wl.watchlists.length).catch(() => {});
}

// One-time hello on first visit.
function showWelcome() {
  let seen = false; try { seen = localStorage.getItem('welcomed') === '1'; } catch {}
  if (seen) return;
  const first = (user.name || user.email.split('@')[0]).split(' ')[0];
  const staff = ['admin', 'broker', 'agent'].includes(user.role);
  $('welcome').innerHTML = `<div class="welcome"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>Welcome, ${esc(first)}.</h3><button class="dismiss" onclick="try{localStorage.setItem('welcomed','1')}catch(e){};document.getElementById('welcome').innerHTML=''">got it</button></div>
    <p>Every morning IronScout pulls the auction and dealer sites, works out what each machine is really worth, and flags the ones priced under that. The cards below are today's best.</p>
    <p>Type any machine up top to see its value and everything listed. ${staff ? 'Put your buyers in on the <a href="/broker.html#buyers">Broker board</a> and the deals that fit them come first, with the price delivered to their yard.' : 'Tap <b>Watch</b> on a machine to get alerted when a new one shows up under market.'}</p>
    <p class="small muted">Something look wrong? Tap <b>Share</b> on the card and send it to Mikey. <a href="/help.html">How it works</a> has the details.</p></div>`;
}

// Compact (tap to open) vs full cards. Phones start compact.
let viewMode = 'full';
try { viewMode = localStorage.getItem('view') || (window.innerWidth < 700 ? 'compact' : 'full'); } catch { viewMode = window.innerWidth < 700 ? 'compact' : 'full'; }
function setView(m) { viewMode = m; try { localStorage.setItem('view', m); } catch {} applyView(); }
function applyView() {
  $('list').classList.toggle('compact', viewMode === 'compact');
  document.querySelectorAll('.viewtoggle button').forEach(b => b.classList.toggle('on', b.dataset.v === viewMode));
}
const viewToggle = () => `<div class="viewtoggle"><button data-v="compact" onclick="setView('compact')">Compact</button><button data-v="full" onclick="setView('full')">Full</button></div>`;

// First-run checklist: the three things that make the site useful. Goes away once they're done (or dismissed).
async function showSetup(watchCount) {
  let hidden = false; try { hidden = localStorage.getItem('setup-dismissed') === '1'; } catch {}
  if (hidden) return;
  const staff = ['admin', 'broker', 'agent'].includes(user.role);
  const [s, b] = await Promise.all([api('/api/settings'), staff ? api('/api/buyers').catch(() => ({ buyers: [] })) : Promise.resolve(null)]);
  let looked = false; try { looked = localStorage.getItem('looked-up') === '1'; } catch {}
  const steps = [
    { done: !!s.yard_state, href: '/account.html#sec-yard', t: 'Set where you take delivery', d: 'Every deal then shows the price landed at your yard.' },
    { done: looked || watchCount > 0, href: '#', onclick: "document.getElementById('q').focus();return false", t: 'Look up a machine', d: 'Type one above: winch truck, frac pump, wheel loader…' },
  ];
  if (staff) steps.push({ done: !!(b && b.buyers && b.buyers.length), href: '/broker.html#buyers', t: 'Add a buyer', d: 'Who you sell to and what they want. Matching deals come first, with their delivered price.' });
  if (s.commission_percent === null || s.commission_percent === undefined) steps.push({ done: false, href: '/account.html#comm', t: 'Enter your commission %', d: 'Private to you. Each deal then shows what you\'d earn.' });
  if (steps.every(x => x.done)) return;
  const n = steps.filter(x => x.done).length;
  $('setup').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3>Get set up <span class="muted small" style="font-weight:400">${n} of ${steps.length} done</span></h3><button class="dismiss" onclick="try{localStorage.setItem('setup-dismissed','1')}catch(e){};document.getElementById('setup').innerHTML=''">hide</button></div>
    ${steps.map(x => `<a class="step ${x.done ? 'done' : ''}" href="${x.href}"${x.onclick ? ` onclick="${x.onclick}"` : ''}><span class="tick">${x.done ? '✓' : ''}</span><span><span class="t">${x.t}</span><small>${x.d}</small></span></a>`).join('')}</div>`;
}

// Landing view: the best open deals across every machine, so a new account is never blank
async function feed() {
  $('list').innerHTML = '<div class="empty">Loading the best deals…</div>';
  try {
    const r = await api('/api/deals?limit=40&sort=score');
    const deals = r.deals || [];
    savedIds = new Set();
    $('list').innerHTML = deals.length
      ? `<div class="listhead"><h2>Best deals right now</h2>${viewToggle()}</div>` + deals.map(d => dealCard(d, { saved: false })).join('')
      : '<div class="empty">No deals yet. Search a machine above to get started.</div>';
    applyView();
  } catch (e) { $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function go(q, opts = {}) {
  clearTimeout(pollTimer);               // a pending check for some other machine must never replace this one
  if (!(opts && opts.keep)) scope = 'deals';
  const keep = opts.keep && current === q, y = window.scrollY;
  $('q').value = q; current = q;
  try { localStorage.setItem('looked-up', '1'); } catch {}
  history.replaceState(null, '', '/?q=' + encodeURIComponent(q));
  if (!keep) { $('result').innerHTML = ''; $('list').innerHTML = '<div class="empty">Looking…</div>'; }
  const r = await api('/api/lookup?q=' + encodeURIComponent(q) + (showAll ? '&all=1' : ''));
  if (!r.tracked) {                       // brand-new machine: start tracking + fetching it right away
    $('list').innerHTML = `<div class="empty">New machine — starting a search for "${esc(q)}"…</div>`;
    await requestIt(q);
    return;
  }
  if (r.fetching || (r.active_listings === 0 && !r.last_updated)) {
    $('result').innerHTML = '';
    $('list').innerHTML = `<div class="empty"><div class="spin"></div>Searching the auction sites for "${esc(r.product.name)}"… this usually takes 2–5 minutes. You can leave this page open; it refreshes itself.</div>`;
    clearTimeout(pollTimer); pollTimer = setTimeout(() => { if (current === q) go(q); }, 20000);
    return;
  }
  const m = r.market;
  const states = m.by_state.slice(0, 6).map(s => `${esc(s.region)} ${money(s.median_price)} <span class="muted">(${s.sample_size})</span>`).join(' &nbsp;·&nbsp; ');
  $('result').innerHTML = `
    <div class="market">
      <div class="stat"><div class="v">${m.us_median ? money(m.us_median) : '—'}</div><div class="l">${m.basis === 'sold' ? `Market value — from ${m.sample_size} actual sales` : `Market value — asking prices (${m.sample_size})`}${m.sample_size < 8 ? ' · <b style="color:var(--accent)">thin data, treat as a ballpark</b>' : ''}</div></div>
      <div class="stat"><div class="v">${m.us_p25 && m.us_p75 ? money(m.us_p25) + '–' + money(m.us_p75) : '—'}</div><div class="l">Typical range (25th–75th)</div></div>
      <div class="stat"><div class="v">${r.active_listings}</div><div class="l">Active listings tracked</div></div>
      <div class="stat"><div class="v">${r.all_deals}</div><div class="l">Priced under market</div></div>
    </div>
    <div class="heading"><div class="small muted">${m.basis === 'sold'
      ? `Market value is the middle price of ${m.sample_size} ${esc(r.product.name)}s that actually sold in the last few months. A deal is a live listing priced well under that, after auction fees.`
      : `Market value is the middle asking price of ${m.sample_size} live listings. We've seen ${r.sales_count} completed sale${r.sales_count === 1 ? '' : 's'}, but only ${r.sales_recent} from the last ${r.sold_window_days} days — we need ${r.sold_min} recent ones to price from sold prices. It gets more accurate as new sales come in.`}</div></div>
    ${r.recent_sales && r.recent_sales.length ? `<div class="heading"><details style="width:100%"><summary class="small" style="cursor:pointer">Recent sales we've seen (${r.sales_count}) — what these actually sold for</summary>
      <div class="small" style="margin-top:8px">${r.recent_sales.map(x => `<div style="padding:5px 0;border-bottom:1px solid var(--line)"><b>${money(x.price)}</b> · ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="muted">· ${[x.city, x.state].filter(Boolean).join(', ')}${x.hours ? ` · ${Number(x.hours).toLocaleString()} hrs` : ''}${x.sold_at ? ` · ${new Date(x.sold_at).toLocaleDateString()}` : ''} · ${esc(x.source)}</span></div>`).join('')}</div></details></div>` : ''}
    ${states ? `<div class="heading"><div class="small muted">By state: ${states}</div></div>` : ''}
    ${r.parts_listings && r.parts_listings.length ? `<div class="heading"><details style="width:100%"><summary class="small" style="cursor:pointer">Parts &amp; attachments (${r.parts_listings.length}) — forks, buckets, tires, cabs listed under this machine</summary>
      <div class="small muted" style="margin:6px 0">Real listings, kept here in case a buyer wants one. They never count toward the market value or the deals.</div>
      <div class="small" id="parts-list">${r.parts_listings.map(x => `<div style="padding:5px 0;border-bottom:1px solid var(--line)" id="part-${x.id}"><b>${money(x.price)}</b> · ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="muted">· ${[x.city, x.state].filter(Boolean).join(', ')} · ${esc(SOURCE_NAMES[x.source] || x.source)}${x.marked ? ' · marked by staff' : ' · auto-sorted'}</span>${x.marked && window.CAN_HIDE ? ` <button class="small" style="margin-left:6px" onclick="unmarkParts('${x.id}')">It's a machine</button>` : ''}</div>`).join('')}</div></details></div>` : ''}
    ${m.abroad && m.abroad.length ? `<div class="heading"><details style="width:100%"><summary class="small" style="cursor:pointer"><b>Abroad:</b> ${m.abroad.sort((a, b) => b.sample_size - a.sample_size).slice(0, 5).map(a => `${esc(a.country)} ${money(a.median_price)} <span class="muted">(${a.sample_size})</span>${m.us_median ? ` <span style="color:${a.median_price > m.us_median ? 'var(--good, #4caf50)' : 'var(--muted)'}">${a.median_price > m.us_median ? '+' : ''}${Math.round((a.median_price - m.us_median) / m.us_median * 100)}%</span>` : ''}`).join(' &nbsp;·&nbsp; ')}</summary>
      <div class="small muted" style="margin:6px 0">Asking prices on overseas dealer sites (Mascus, PlantAndEquipment), in US dollars. A machine that sells for more abroad than here is an export lead. These never count toward the US market value.</div>
      <div class="small">${(r.abroad_listings || []).map(x => `<div style="padding:5px 0;border-bottom:1px solid var(--line)"><b>${money(x.price)}</b> · ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="muted">· ${[x.city, x.country_name].filter(Boolean).join(', ')}${x.hours ? ` · ${Number(x.hours).toLocaleString()} hrs` : ''} · ${esc(SOURCE_NAMES[x.source] || x.source)}</span></div>`).join('')}</div></details></div>` : ''}
    ${r.spec_note ? `<div class="heading"><div class="small" style="color:var(--accent)">${esc(r.spec_note)}</div></div>` : ''}
    <div class="heading">
      <h3>${esc(r.product.name)} — ${r.count} deal${r.count === 1 ? '' : 's'} ${r.filters_applied ? 'matching your settings' : '(all deals, settings ignored)'}</h3>
      <div class="small sortrow"><label class="muted">Sort <select id="sort" onchange="sortBy=this.value;renderDeals()"><option value="score">best first</option><option value="ending">ending soonest</option><option value="margin">biggest profit</option><option value="price">cheapest</option><option value="newest">newest</option></select></label>
        <label class="muted">Show <select id="kind" onchange="kindFilter=this.value;renderDeals()"><option value="all">everything</option><option value="listing">buy now only</option><option value="auction">auctions only</option></select></label>
        <div class="viewtoggle" id="scope-toggle" style="margin-left:0"><button data-s="deals" onclick="setScope('deals')">Deals</button><button data-s="all" onclick="setScope('all')">All live</button></div>${viewToggle()}</div>
      <div class="small">
        ${r.filters_applied ? `<a href="#" onclick="showAll=true;go(current);return false">Show all ${r.all_deals} deals</a>` : `<a href="#" onclick="showAll=false;go(current);return false">Apply my settings</a>`}
        &nbsp;·&nbsp; <a href="/listings.html?m=${encodeURIComponent(r.product.name)}"><b>See every live listing</b></a> &nbsp;·&nbsp; <a href="/account.html">Change settings</a>${r.yard ? '' : ' &nbsp;·&nbsp; <a href="/account.html#sec-yard">Set my yard for delivered prices</a>'}
        &nbsp;·&nbsp; ${r.watched ? `<span class="muted">★ On your watchlist</span>` : `<a href="#" onclick="watch(${r.product.id});return false">★ Watch this machine</a>`}
        ${r.last_updated ? `&nbsp;·&nbsp; <span class="muted">updated ${new Date(r.last_updated).toLocaleString()}</span>` : ''}
      </div>
    </div>`;
  savedIds = new Set(r.deals.filter(d => d.saved).map(d => d.id));
  lastResult = r; $('sort').value = sortBy; $('kind').value = kindFilter; renderDeals();
  if (keep) window.scrollTo(0, y);       // quiet refresh: stay where you were
}
let lastResult = null, sortBy = 'score', kindFilter = 'all';
function applyViewSoon() { setTimeout(applyView, 0); }
function renderDeals() {
  const r = lastResult; if (!r) return;
  const far = 8.64e15;
  const sorters = {
    score: (a, b) => b.deal_score - a.deal_score,
    ending: (a, b) => (a.auction_ends ? new Date(a.auction_ends) : far) - (b.auction_ends ? new Date(b.auction_ends) : far),
    margin: (a, b) => b.estimated_margin - a.estimated_margin,
    price: (a, b) => a.price - b.price,
    newest: (a, b) => new Date(b.flagged_at) - new Date(a.flagged_at),
  };
  const deals = [...r.deals].filter(d => kindFilter === 'all' || (kindFilter === 'auction' ? d.sale_type === 'auction' : d.sale_type !== 'auction')).sort(sorters[sortBy] || sorters.score);
  applyViewSoon();
  document.querySelectorAll('#scope-toggle button').forEach(b => b.classList.toggle('on', b.dataset.s === scope));
  if (scope === 'all' || (!deals.length && scope !== 'deals-forced')) { renderAllLive(r, deals.length); return; }
  $('list').innerHTML = deals.length ? deals.map(d => dealCard(d, { saved: d.saved })).join('')
    : `<div class="empty">Nothing under market right now${r.filters_applied ? ' that clears your settings' : ''}${kindFilter !== 'all' ? ` (${kindFilter === 'auction' ? 'auctions' : 'buy-now listings'} only)` : ''}.<br>${r.watched ? 'You\'ll be alerted when one shows up.' : `<button class="primary" style="margin-top:12px" onclick="watch(${r.product.id})">★ Watch this machine and alert me</button>`}</div>`;
}
async function watch(id) { await api('/api/watchlists', { method: 'POST', body: { product_id: id } }); go(current, { keep: true }); }
// "All live": every listing for the machine, with how it sits against normal, so a thin machine never shows an empty page
let scope = 'deals', liveCache = {};
function setScope(sc) { scope = sc === 'deals' ? 'deals-forced' : sc; renderDeals(); }
async function renderAllLive(r, dealCount) {
  const name = r.product.name;
  const why = scope === 'all' ? '' : `<div class="heading"><div class="small" style="color:var(--accent)">Nothing priced under market right now${r.filters_applied ? ' that clears your settings' : ''}, so here is everything live for ${esc(name)}. ${r.watched ? 'You\'ll be alerted when a deal shows up.' : ''}</div></div>`;
  $('list').innerHTML = why + '<div class="empty">Loading every live listing…</div>';
  try {
    const d = liveCache[name] || (liveCache[name] = await api('/api/search/machine?name=' + encodeURIComponent(name)));
    let rows = [...d.listings].filter(l => kindFilter === 'all' || (kindFilter === 'auction' ? l.sale_type === 'auction' : l.sale_type !== 'auction'));
    const far = 8.64e15;
    rows.sort({ price: (a, b) => a.price - b.price, ending: (a, b) => (a.auction_ends ? new Date(a.auction_ends) : far) - (b.auction_ends ? new Date(b.auction_ends) : far), newest: (a, b) => new Date(b.posted_date) - new Date(a.posted_date) }[sortBy] || ((a, b) => (a.vs_normal_pct ?? 999) - (b.vs_normal_pct ?? 999)));
    const vs = (l) => l.vs_normal_pct == null ? '<span class="muted small">no comparison yet</span>' : l.vs_normal_pct <= -10 ? `<span class="small" style="color:var(--good)">${Math.abs(l.vs_normal_pct)}% under normal</span>` : l.vs_normal_pct >= 10 ? `<span class="small" style="color:var(--warn)">${l.vs_normal_pct}% over normal</span>` : `<span class="small muted">about normal (${l.vs_normal_pct > 0 ? '+' : ''}${l.vs_normal_pct}%)</span>`;
    $('list').innerHTML = why + `<div class="heading"><div class="small muted">${rows.length} live listing${rows.length === 1 ? '' : 's'}${d.normal ? ` · normal is ${money(d.normal)}` : ''}${dealCount ? ` · ${dealCount} of them are deals` : ''}</div></div>` +
      (rows.length ? rows.map(l => `<div class="card" onclick="cardTap(event,this)">
        ${l.image_url ? `<a class="photo" href="${esc(l.url || '#')}" target="_blank" rel="noopener"><img src="${esc(l.image_url)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>` : ''}
        <div class="top"><div class="title">${esc(l.title)}</div></div>
        <div class="price">${money(l.price)} ${vs(l)}</div>
        <div class="small muted x">${l.sale_type === 'auction' ? 'Auction' + (l.auction_ends ? ' · ends ' + new Date(l.auction_ends).toLocaleDateString() : '') : 'Buy now / offer'} · ${esc([l.city, l.state].filter(Boolean).join(', ') || 'location unknown')}${l.year ? ' · ' + l.year : ''}${l.hours ? ' · ' + Number(l.hours).toLocaleString() + ' hrs' : ''} · ${esc(SOURCE_NAMES[l.source] || l.source)}</div>
        <div class="actions">${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener" style="flex:1"><button class="primary" style="width:100%">View listing</button></a>` : ''}${blockBtn(l.id)}</div>
      </div>`).join('') : '<div class="empty">No live listings for this machine right now.</div>');
    applyViewSoon();
  } catch (e) { $('list').innerHTML = why + `<div class="empty">${esc(e.message)}</div>`; }
}
let pollTimer = null;
async function requestIt(term) {
  const r = await api('/api/watchlists/request', { method: 'POST', body: { term } });
  $('list').innerHTML = `<div class="empty"><div class="spin"></div>${esc(r.message)}<br><span class="small muted">You can leave this page open; it refreshes itself.</span></div>`;
  clearTimeout(pollTimer); pollTimer = setTimeout(() => { if (current === term) go(term); }, 20000);
}
async function saveDeal(id) { await api('/api/watchlists/saved/' + id, { method: 'POST' }); go(current, { keep: true }); }
async function unsaveDeal(id) { await api('/api/watchlists/saved/' + id, { method: 'DELETE' }); go(current, { keep: true }); }
$('f').onsubmit = (e) => { e.preventDefault(); if ($('q').value.trim()) go($('q').value.trim()); };
init().catch(e => { if (!['login', 'subscribe'].includes(e.message)) console.error(e); });
</script></body></html>
